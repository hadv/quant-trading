apiVersion: apps/v1
kind: Deployment
metadata:
  name: deep-portfolio-agent
  labels:
    app: deep-portfolio-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deep-portfolio-agent
  template:
    metadata:
      labels:
        app: deep-portfolio-agent
    spec:
      containers:
      - name: agent
        image: ghcr.io/hadv/deep-portfolio-agent:latest
        imagePullPolicy: Always
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: url
        - name: MAX_ASSETS
          value: "100"
        - name: NUM_SIMULATIONS
          value: "10000"
