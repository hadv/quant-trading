apiVersion: batch/v1
kind: Job
metadata:
  name: backfill-market-data
  namespace: quant-trading
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: backfill-service
    spec:
      serviceAccountName: backfill-worker-sa
      containers:
      - name: backfill-worker
        image: ghcr.io/hadv/quant-backfill:latest
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: cnpg-cluster-app-secret
              key: uri
      restartPolicy: OnFailure
