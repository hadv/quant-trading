version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: quantdb
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh

  kafka:
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER

  liquibase:
    image: liquibase/liquibase:4.23.0
    command: 
      - --url=jdbc:postgresql://db:5432/quantdb
      - --username=user
      - --password=pass
      - --changeLogFile=db.changelog-master.sql
      - update
    volumes:
      - ./db/changelog:/liquibase/changelog
    working_dir: /liquibase/changelog
    depends_on:
      - db

  fractal_analyzer:
    build:
      context: ./python/fractal_analyzer
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://user:pass@db:5432/fractaldb
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - db
      - kafka
    ports:
      - "8000:8000"

  fundamental_agent:
    build:
      context: ./python/fundamental_agent
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://user:pass@db:5432/fundamentaldb
      KAFKA_BROKERS: kafka:9092
      KAFKA_CONSUMER_GROUP: fundamental_agent_group
      KAFKA_TOPIC_IN: market.events
      KAFKA_TOPIC_OUT: analysis.events
      OPENAI_API_KEY: ${OPENAI_API_KEY:-dummy-key}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-gpt-3.5-turbo}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-dummy-key}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-quant-trading}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://localhost:9000}
      PROTONX_OCR_API_URL: ${PROTONX_OCR_API_URL:-http://localhost:8080/ocr}
    depends_on:
      - db
      - kafka
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/app/chroma_db

volumes:
  pgdata:
  chroma_data:
